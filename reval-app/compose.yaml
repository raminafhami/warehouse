services:
  mongo:
    build:
      context: .
      dockerfile: docker/mongo.Dockerfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: reval_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: reval_dev
      REVAL_DB_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    networks: [data]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh 'mongodb://127.0.0.1:27017/admin?directConnection=true' --quiet
          --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --file /usr/local/bin/mongo-ready.js
      interval: 3s
      timeout: 6s
      retries: 30
      start_period: 8s
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4000
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:8080}
      REVAL_ADMIN_USERNAME: ${REVAL_ADMIN_USERNAME:-}
      REVAL_ADMIN_PASSWORD: ${REVAL_ADMIN_PASSWORD:-}
      MONGODB_URI: mongodb://reval_app:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}@mongo:27017/reval_dev?replicaSet=rs0&authSource=reval_dev
      ALLOW_DEMO_SEED: "false"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [data, web]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [web]

networks:
  data:
    internal: true
  web:

volumes:
  mongo-data:
