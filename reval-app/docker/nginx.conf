server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://api:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
